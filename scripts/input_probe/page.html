<!doctype html>
<meta charset="utf-8">
<title>input probe</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}#t{position:fixed;inset:0}#k{position:fixed;left:8px;top:8px;width:120px}</style>
<div id="t"></div><input id="k" autocomplete="off">
<script>
// Input-probe page (rows I1-I7). Passive: it only listens and logs raw events. A snapshot of the whole log is POSTed
// every 300 ms while it changes (every tick is kept: a ring that dropped the early ticks made I1 pair early moves with a far later one) (the reply names the phase the harness is in, which tags later events), so a run with no driver (SendInput control) is read the same way as a driven one.
const q = new URLSearchParams(location.search);
const L = [], RAF = [];
let dirty = true, seq = 0, PH = 'boot';
const cc = e => (typeof e.getCoalescedEvents === 'function' && e.type === 'pointermove') ? e.getCoalescedEvents().length : -1;
const cts = e => (typeof e.getCoalescedEvents === 'function' && e.type === 'pointermove') ? e.getCoalescedEvents().map(c => c.timeStamp) : null;
const cxy = e => (typeof e.getCoalescedEvents === 'function' && e.type === 'pointermove') ? e.getCoalescedEvents().map(c => [c.clientX, c.clientY]) : null;
const pc = e => (typeof e.getPredictedEvents === 'function' && e.type === 'pointermove') ? e.getPredictedEvents().length : -1;
function rec(e) {
  if (/enter|leave/.test(e.type) && e.target !== document.documentElement) return;   // one per ancestor otherwise
  L.push({n: seq++, t: e.type, ts: e.timeStamp, now: performance.now(), x: e.clientX, y: e.clientY, b: e.button,
          bs: e.buttons, d: e.detail, rep: e.repeat === undefined ? null : e.repeat, key: e.key === undefined ? null : e.key,
          rt: 'relatedTarget' in e ? (e.relatedTarget === null ? 'null' : 'node') : null, cs: cc(e), ps: pc(e), cts: cts(e), cxy: cxy(e),
          tr: e.isTrusted, pt: e.pointerType || null, ph: PH});
  dirty = true;
}
// pointerrawupdate (I7) is logged with its timeStamp and performance.now(): a burst forwarded back to back shows two at one `now`
const TYPES = ['pointerrawupdate', 'pointermove', 'mousemove', 'pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click', 'dblclick', 'contextmenu',
  'pointerover', 'pointerout', 'pointerenter', 'pointerleave', 'mouseover', 'mouseout', 'mouseenter', 'mouseleave',
  'keydown', 'keyup', 'keypress'];
// enter/leave do not bubble and window's capture never sees them: the document gets those, the window the rest, so none is logged twice
for (const t of TYPES) (/enter|leave/.test(t) ? document : window).addEventListener(t, rec, true);
document.addEventListener('contextmenu', e => e.preventDefault());
function tick(ts) { RAF.push([ts, performance.now()]); dirty = true; requestAnimationFrame(tick); }
requestAnimationFrame(tick);
function meta() {
  return {dpr: devicePixelRatio, iw: innerWidth, ih: innerHeight, ow: outerWidth, oh: outerHeight, sx: screenX, sy: screenY,
          secure: isSecureContext, coalesced_fn: typeof PointerEvent.prototype.getCoalescedEvents === 'function',
          predicted_fn: typeof PointerEvent.prototype.getPredictedEvents === 'function', ua: navigator.userAgent};
}
// Only what is new is sent (evFrom / rafFrom say where it starts): a whole-log snapshot grows to megabytes, and stringifying it
// every 300 ms janks the main thread, which skips frames (2026-11-22: rAF gaps over 25 ms 3 % in a 60 s run, 0 in a short one).
let sentEv = 0, sentRaf = 0, inflight = false;
setInterval(() => {
  if (!dirty || inflight) return;
  dirty = false;
  inflight = true;
  const ne = L.length, nr = RAF.length;
  fetch('/result?arm=' + encodeURIComponent(q.get('arm')) + '&run=' + encodeURIComponent(q.get('run')),
        {method: 'POST', body: JSON.stringify({meta: meta(), evFrom: sentEv, ev: L.slice(sentEv, ne), rafFrom: sentRaf, raf: RAF.slice(sentRaf, nr)})})
    .then(r => r.text()).then(t => { PH = t; sentEv = ne; sentRaf = nr; }).catch(() => { dirty = true; })
    .finally(() => { inflight = false; });
}, 300);
</script>
