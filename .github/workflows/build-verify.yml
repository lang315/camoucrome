# Build + verify on the build box (self-hosted runner `buildpc-wsl`, WSL2 Ubuntu
# 24.04 with the Chromium checkout at ~/chromium/src on branch camoucrome/main).
#
# What it proves per push: the pushed change set is byte-identical to the built
# checkout (check_checkout_sync.sh), out/Default rebuilds from it (autoninja
# reports its step count), the camoucfg unit suites pass, and the browser
# verifies that matter most run green against that binary. It never edits the
# checkout: when the checkout has uncommitted work (a slice in progress) the job
# fails fast with "checkout dirty" and is re-run later by hand
# (workflow_dispatch). It also refuses to start while a ninja is already running
# in out/Default, so a manual build is never raced.
name: build-verify
on:
  push:
    branches: [main]
    paths: [patches/**, additions/**, settings/**, scripts/**, client/**, upstream.env, .github/workflows/build-verify.yml]
  workflow_dispatch:
# An explicit `shell: bash` makes GitHub run `bash --noprofile --norc -eo
# pipefail {0}`; the implicit default is `bash -e {0}`, where `cmd | tail`
# reports tail's status and hides every failure below.
defaults:
  run:
    shell: bash
concurrency:
  group: buildpc
  cancel-in-progress: false
jobs:
  build-verify:
    runs-on: [self-hosted, buildpc-wsl]
    timeout-minutes: 180
    steps:
      # $HOME, not a literal home path: the repository is public (spec 2026-10-18), and env: does not expand ~
      - name: box paths
        run: |
          { echo "SRC=$HOME/chromium/src"; echo "VERIFY=$HOME/camoucrome-verify"
            echo "CLIENT=$HOME/camoucrome-client"; echo "PLAYWRIGHT_NODEJS_PATH=$HOME/camoucrome-driver/node"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: checkout is clean and no build is running
        run: |
          set -e
          cd "$SRC"
          test "$(git rev-parse --abbrev-ref HEAD)" = camoucrome/main || { echo "not on camoucrome/main"; exit 1; }
          n=$(git status --porcelain | wc -l); test "$n" -eq 0 || { echo "checkout dirty ($n paths): a slice is in progress, re-run later"; exit 1; }
          ! pgrep -f "ninja -C out/(Default|Release)" >/dev/null || { echo "a ninja is already running in this checkout"; exit 1; }
          # A Windows build on the same PC is invisible to pgrep; it holds this lock instead.
          bash "$GITHUB_WORKSPACE/scripts/build_lock.sh" status
      - name: pushed change set == built checkout
        run: bash scripts/check_checkout_sync.sh
      - name: pre-flight checks
        run: |
          python3 scripts/check_additions_build.py
          python3 scripts/check_lgpl_boundary.py
          python3 scripts/gen_cursory_table.py --check
          python3 scripts/gen_keys.py --check
          python3 scripts/gen_fontconfig.py --check
          python3 scripts/check_patch_deps.py --src "$SRC"
      - name: sync the client tree the verifies import
        run: |
          # --delete so a module removed from the repo cannot linger and still
          # import; baselines/ keeps box-local captures, so it is not mirrored.
          rsync -a --delete --exclude '*.egg-info' --exclude node_modules --exclude __pycache__ client/ "$CLIENT/client/"
          rsync -a settings/ "$CLIENT/settings/"
          rsync -a baselines/ "$CLIENT/baselines/"
          rsync -a scripts/ "$CLIENT/scripts/"
          cp scripts/verify_*.py scripts/lib_shell.py scripts/lib_argv.py scripts/gpu_gate.py scripts/capture_host_oracle.py scripts/echo_server.py scripts/observe_report.py scripts/sp2b_analysis.py scripts/sp2e_analysis.py "$VERIFY/"
          (cd "$CLIENT/client/python" && "$VERIFY/venv/bin/python3" -m pip install -q -e . 2>&1 | tail -1)
      - name: build out/Default (chrome, content_shell, components_unittests)
        run: |
          export PATH=$HOME/depot_tools:$PATH
          L="$GITHUB_WORKSPACE/scripts/build_lock.sh"; OWNER="ci run $GITHUB_RUN_ID"
          bash "$L" acquire "$OWNER"
          trap 'bash "$L" release "$OWNER"' EXIT
          cd "$SRC"
          autoninja -C out/Default chrome content_shell components_unittests 2>&1 | tail -3 | tee /tmp/build.txt
          grep -q "Build Succeeded" /tmp/build.txt
      - name: camoucfg unit suites
        run: |
          cd "$SRC"
          F=$(grep -hoE '^TEST(_F)?\(\w+' components/camoucfg/*_unittest.cc components/camoucfg_lgpl/*_unittest.cc | sed -E 's/^TEST(_F)?\(//' | sort -u | grep -v CoherenceValidatorTest | sed 's/$/.*/' | paste -sd:)
          # One run into a file: `| grep -q` would close the pipe early and, under
          # pipefail, fail the step on the test binary's SIGPIPE.
          rc=0; out/Default/components_unittests --gtest_filter="$F" > /tmp/camoucfg_ut.txt 2>&1 || rc=$?
          grep -E 'SUCCESS|FAIL' /tmp/camoucfg_ut.txt | tail -3 || true
          test "$rc" -eq 0
          grep -q "SUCCESS: all tests passed" /tmp/camoucfg_ut.txt
          bash "$GITHUB_WORKSPACE/scripts/run_coherence_tests.sh" 2>&1 | tail -1
      - name: client tests
        run: |
          "$VERIFY/venv/bin/python3" -m pytest -q client/python/tests scripts/test_fonts.py scripts/test_gen_keys.py scripts/test_winhost.py scripts/test_capture_wheel_oracle.py scripts/test_package.py scripts/test_check_patch_deps.py scripts/test_build_lock.py scripts/test_windows_verify_set.py scripts/test_gpu_gate.py scripts/test_step2_rows.py scripts/test_verify_d_pointer_touch.py scripts/test_verify_sp7_phonehome.py scripts/test_observe_report.py scripts/test_observe_judge.py scripts/test_verify_observe.py 2>&1 | tail -1
          (cd client/go && go test ./... 2>&1 | tail -2)
          (cd client/go/rodclient && go test ./... 2>&1 | tail -2)
      - name: Go probe
        run: |
          # verify_sp6b_driver runs the Go client through this binary; a stale one would test an old client
          cd client/go && go build -o "$HOME/camoucrome-go/camoucrome-probe" ./cmd/camoucrome-probe
      - name: rodclient probe
        run: |
          # the go-rodclient row of verify_sp6b_driver runs this binary; a stale one would test an old client
          cd client/go/rodclient && go build -o "$HOME/camoucrome-go/camoucrome-probe-rodclient" ./cmd/camoucrome-probe-rodclient
      - name: browser verifies
        run: |
          cd "$VERIFY"
          rc=0
          run() { echo "== $1"; if "$VERIFY/venv/bin/python3" "$@" > "/tmp/$1.log" 2>&1; then tail -1 "/tmp/$1.log"; else echo "FAILED $1"; grep -E "FAIL|DIFF|Error" "/tmp/$1.log" | head -12 || true; return 1; fi; }
          # The scripts and their order come from scripts/ci_verify_set.txt (every verify_*.py is listed there, run or skipped
          # with a reason, and scripts/test_ci_verify_set.py fails on one that is not). A `run` line may carry KEY=VAL words:
          # verify_sp6b_generator takes CAMOU_GEN_N=4 (seeds 1000..1003 include a DPR 1.5 identity and 1.25 identities of
          # different residues, the cases the launch window rounding got wrong (PR #34); 2 never reached them; about 3 s per config).
          # verify_sp6b_driver (about 25 s, seven drivers) needs on the runner, all under $HOME and present on the box:
          #   venv/ (patchright) and venv-stock/ (playwright) in camoucrome-verify, camoucrome-driver/ and
          #   camoucrome-driver-stock/ (the patchright-core and playwright-core 1.62.1 packages plus a node), and the Go probe
          #   at camoucrome-go/camoucrome-probe, rebuilt from client/go by the step "Go probe" so it never lags the client; the rodclient probe at
          #   camoucrome-go/camoucrome-probe-rodclient, rebuilt by the step "rodclient probe".
          while read -r script envs; do
            ( [ -z "$envs" ] || export $envs; run "$script" ) || rc=1
          done < <(python3 "$GITHUB_WORKSPACE/scripts/ci_verify_set.py" list)
          # needs camou_observe = true in out/Default/args.gn (docs/observer/README.md)
          if grep -q '^camou_observe = true' "$HOME/chromium/src/out/Default/args.gn"; then run verify_observe.py || rc=1; else echo "SKIP verify_observe.py: camou_observe not set in out/Default/args.gn"; fi
          exit $rc
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs-${{ github.run_number }}
          path: /tmp/verify_*.log
          if-no-files-found: ignore
