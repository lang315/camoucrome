# Cheap CI (SP6 4.x, roadmap A5 #4): everything that needs no Chromium
# checkout. Full builds stay on the build box until a release cadence exists.
name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The repository is public: every file, message and commit date is published (spec 2026-10-18).
      - name: no host-identifying data
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        # --ci: tracked files, then PR_BASE..PR_HEAD, BEFORE..HEAD, or (new branch, force-push) the whole history
        # A secret is empty on a fork PR (and after it is deleted or renamed), and the gate would then run its generic
        # patterns only and stay green: refuse that on a push and on a same-repo PR. Only a fork PR may run without terms.
        run: |
          extra=""
          if [ "${{ github.event_name }}" = push ] || [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            extra="--require-terms"
          fi
          python3 scripts/check_privacy.py --ci $extra
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: additions are all in BUILD.gn
        run: python3 scripts/check_additions_build.py
      - name: LGPL include boundary
        run: python3 scripts/check_lgpl_boundary.py
      - name: cursory table matches its data
        run: python3 scripts/gen_cursory_table.py --check
      - name: keys.h matches keys.json and every call site
        run: python3 scripts/gen_keys.py --check
      - name: gen9_thread_caps.h matches the caps JSON
        run: python3 scripts/gen_thread_caps_header.py --check
      - name: fontconfig files match settings/fonts.json
        run: python3 scripts/gen_fontconfig.py --check
      - name: patches/series names existing patches, once each
        run: |
          set -e
          while read -r p; do [ -z "$p" ] && continue; test -f "patches/$p" || { echo "missing patches/$p"; exit 1; }; done < patches/series
          test "$(sort patches/series | uniq -d | wc -l)" -eq 0
          for f in patches/*.patch; do grep -qx "$(basename "$f")" patches/series || { echo "$f not in series"; exit 1; }; done
      - name: settings JSON parses and invariants/keys agree
        run: |
          python3 - <<'EOF2'
          import json, pathlib
          keys = {k["key"] for k in json.loads(pathlib.Path("settings/keys.json").read_text())["keys"]}
          inv = json.loads(pathlib.Path("settings/invariants.json").read_text())
          for e in inv["invariants"]:
              for k in e["keys"]:
                  assert k in keys, (e["id"], k)
          json.loads(pathlib.Path("settings/launcher.json").read_text())
          for p in pathlib.Path("settings/presets").glob("*.json"):
              json.loads(p.read_text())
          print(len(keys), "keys,", len(inv["invariants"]), "invariants")
          EOF2
      - name: shell scripts parse
        run: for s in scripts/*.sh; do bash -n "$s"; done
      # Needs no browser, no checkout and no pip install: the module stubs
      # playwright when it is absent. It has been a hand-run guard since
      # 2026-08-27 and grep finds it only in docs, which is the same as not
      # having it -- the argv it freezes is what makes every verification's PASS
      # count comparable to the run before.
      - name: argv freeze (lib_shell)
        run: python3 scripts/test_lib_shell_launch.py
      # scripts/ wholesale, not a hand-written list: the list is what let the
      # CLIENT latch regression through. It contained no earlier importer
      # of lib_shell at module scope, so the cross-module import ordering that
      # breaks `pytest scripts/` never happened in CI. A directory also picks up
      # a new test file without anyone remembering to add it -- test_gen_keys.py
      # and test_winhost.py had never run here.
      - name: "python tests: clients, packager, scripts"
        run: |
          python3 -m pip install -q pytest browserforge==1.2.4 maxminddb timezonefinder
          python3 -m pytest -q client/python/tests scripts/
      - name: go client tests
        run: cd client/go && go vet ./... && go test ./...
      - name: go rodclient tests
        run: cd client/go/rodclient && go vet ./... && go test ./...
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: node client tests
        run: cd client/node && npm test
