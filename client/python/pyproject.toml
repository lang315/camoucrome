[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "camoucrome"
version = "0.1.0"
description = "Launcher for the Camoucrome browser: CAMOU_CONFIG / CAMOU_PRESET transport over a patchright driver"
requires-python = ">=3.10"
license = "MPL-2.0"
dependencies = ["patchright==1.62.3", "browserforge==1.2.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["camoucrome*"]

[tool.setuptools.package-data]
camoucrome = ["_settings/settings/*.json", "_settings/settings/webgl/*.json"]

[tool.pytest.ini_options]
markers = ["slow: builds a wheel and installs it into a fresh venv"]
