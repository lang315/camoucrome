[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camoucrome"
version = "0.1.0"
description = "Launcher for the Camoucrome browser: CAMOU_CONFIG / CAMOU_PRESET transport over a patchright driver"
requires-python = ">=3.10"
dependencies = ["patchright==1.62.3", "browserforge==1.2.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["camoucrome*"]
